name: Build APK

on:
  push:
    branches: [rootless]
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      # Signs with a fixed key, so each build installs over the last.
      # Without the secret the APK is left unsigned.
      - name: Set up signing
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        if: env.KEYSTORE_BASE64 != ''
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
          {
            echo "KEYSTORE_FILE=$RUNNER_TEMP/release.jks"
            echo "KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD"
            echo "KEY_ALIAS=$KEY_ALIAS"
            echo "KEY_PASSWORD=$KEYSTORE_PASSWORD"
          } > local.properties

      - name: Build
        run: ./gradlew --no-daemon assembleRelease

      - name: Collect APK
        run: |
          mkdir -p apk
          cp app/build/outputs/apk/release/*.apk apk/
          ls -l apk

      - uses: actions/upload-artifact@v4
        with:
          name: RootlessViPER4Android
          path: apk/*.apk

      - name: Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" apk/*.apk --title "$GITHUB_REF_NAME" --generate-notes
